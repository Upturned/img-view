<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio — img-view</title>

  <script>
    const _t = localStorage.getItem('theme') || 'modern';
    document.write('<link id="theme-link" rel="stylesheet" href="/css/theme-' + _t + '.css">');
  </script>
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="/pages/hub.html">img<span>·</span>view</a>

      <div class="navbar-search">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Filter categories or tracks…" autocomplete="off" />
          <button id="search-clear" class="hidden" title="Clear">✕</button>
        </div>
      </div>

      <div class="navbar-actions">
        <button class="btn btn-ghost" id="btn-nav-organize">Organize</button>
        <button class="btn btn-ghost" id="btn-favorites">Favorites</button>
        <button class="btn btn-primary" id="btn-random-global-audio" title="Random track">Random</button>
        <button class="btn-icon theme-toggle" id="theme-toggle-btn" title="Switch theme"></button>
      </div>
    </div>
  </nav>

  <main class="container page" style="padding-bottom: 5.5rem;">
    <div class="page-layout">

      <div class="page-content">

        <!-- Categories -->
        <section id="section-categories">
          <div class="section-header">
            <h2 id="categories-title">Audio</h2>
            <button class="btn btn-ghost btn-sm" id="btn-new-category">+ New category</button>
          </div>
          <div id="categories-grid" class="image-grid" style="--grid-cols: 5;"></div>
          <div id="categories-empty" class="empty-state hidden">
            <div class="icon">🎵</div>
            <p>No audio categories yet. Drop audio folders into <code>/audio</code> or create one.</p>
          </div>
        </section>

        <!-- Track list (shown when a category is open) -->
        <section id="section-tracks" class="hidden">
          <nav class="breadcrumb">
            <a href="#" id="breadcrumb-home-link">Audio</a>
            <span class="sep">›</span>
            <span class="current" id="breadcrumb-cat-name">—</span>
          </nav>

          <div class="toolbar">
            <div class="toolbar-group">
              <label for="sort-select">Sort</label>
              <select class="select" id="sort-select">
                <option value="name">Name</option>
                <option value="modified">Date modified</option>
              </select>
              <button class="btn-icon" id="btn-order" title="Toggle order">↑</button>
            </div>
            <button class="btn btn-primary btn-sm" id="btn-random-cat-audio">Random</button>
            <span id="track-count" style="font-size:0.8rem;color:var(--text-muted);margin-left:auto;"></span>
          </div>

          <div id="track-list" class="track-list"></div>
          <div id="track-empty" class="empty-state hidden">
            <div class="icon">🎵</div>
            <p>No audio files in this category.</p>
          </div>
        </section>

        <!-- Favorites -->
        <section id="section-favorites" class="hidden">
          <div class="section-header">
            <h2>Favorites</h2>
          </div>
          <div id="track-list-favs" class="track-list"></div>
          <div id="favs-empty" class="empty-state hidden">
            <div class="icon">★</div>
            <p>No favorites yet. Star a track while it's playing to add it here.</p>
          </div>
        </section>

      </div>

      <!-- Tag sidebar -->
      <aside class="tag-sidebar">
        <div class="tag-sidebar-header">
          <span class="tag-sidebar-title">Tags</span>
          <button class="tag-sidebar-clear hidden" id="btn-clear-tags">Clear</button>
        </div>
        <input type="text" class="tag-sidebar-search" id="tag-sidebar-search" placeholder="Search tags…" autocomplete="off" />
        <div class="tag-sidebar-sort-row">
          <button class="tag-sidebar-sort-btn active" id="tag-sort-name" data-sort="name">Name</button>
          <button class="tag-sidebar-sort-btn" id="tag-sort-count" data-sort="count">Count</button>
        </div>
        <div id="tag-sidebar-list" class="tag-sidebar-list">
          <span class="tag-sidebar-empty">Loading…</span>
        </div>
      </aside>

    </div>
  </main>

  <!-- New category modal -->
  <div id="modal-new-category" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">New Audio Category</div>
      <input class="input" id="input-category-name" type="text" placeholder="Category name…" maxlength="80" />
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btn-cancel-category">Cancel</button>
        <button class="btn btn-primary" id="btn-confirm-category">Create</button>
      </div>
    </div>
  </div>

  <!-- Tags panel (slides up above the audio player) -->
  <div id="tags-panel" class="audio-tags-panel">
    <div id="tags-panel-current">
      <span id="tags-panel-label">Tags:</span>
      <div id="tags-display" class="tags"></div>
    </div>
    <div id="tags-picker-zone">
      <div id="tags-picker-header">
        <input type="text" id="tags-picker-search" placeholder="Search tags…" autocomplete="off" />
        <button class="btn btn-ghost btn-sm" id="btn-add-new-tag">+ New tag</button>
      </div>
      <div id="tags-picker-row"></div>
      <input type="text" id="tag-input-new" class="hidden" placeholder="New tag… (Enter to add)" autocomplete="off" />
    </div>
  </div>

  <!-- Audio player bar (fixed at bottom) -->
  <div id="audio-player" class="audio-player hidden">

    <div class="player-info">
      <div class="player-icon">🎵</div>
      <div class="player-text">
        <div id="player-title" class="player-title">—</div>
        <div id="player-subtitle" class="player-subtitle">—</div>
      </div>
    </div>

    <div class="player-controls">
      <button class="player-btn" id="btn-player-prev" title="Previous (Alt+←)">⏮</button>
      <button class="player-btn play-pause" id="btn-player-play" title="Play / Pause (Space)">▶</button>
      <button class="player-btn" id="btn-player-next" title="Next (Alt+→)">⏭</button>
    </div>

    <div class="player-progress">
      <span class="player-time" id="player-time-current">0:00</span>
      <input type="range" class="player-seek" id="player-seek" value="0" min="0" max="100" step="0.1" />
      <span class="player-time" id="player-time-total">0:00</span>
    </div>

    <div class="player-volume">
      <button class="player-btn" id="btn-player-mute" title="Mute (M)">🔊</button>
      <input type="range" class="player-vol-slider" id="player-vol" value="100" min="0" max="100" />
    </div>

    <div class="player-actions">
      <button class="player-btn" id="btn-player-fav" title="Favorite">★</button>
      <button class="player-btn" id="btn-tags-toggle" title="Edit tags">Tags</button>
      <button class="player-btn" id="btn-player-recycle" title="Move to recycle bin">🗑</button>
    </div>

    <audio id="audio-element"></audio>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/context-menu.js"></script>
  <script src="/js/tag-sidebar.js"></script>
  <script src="/js/tag-picker.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/navbar.js"></script>

</body>
</html>
